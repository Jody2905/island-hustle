<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Island Hustle: St. Vincent and the Grenadines</title>
  <meta name="description" content="Drive a minibus, explore the islands, fish from Calliaqua and run a Vincy Mas band. A game set in St. Vincent and the Grenadines, with four modes and 20 levels.">
  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/island.css">
</head>
<body>
<header class="bar">
  <button class="logo" id="home" aria-label="Island Hustle home">
    <img src="img/icon.svg" alt="" width="30" height="30">
    <span>Island <em>Hustle</em></span>
  </button>
  <div class="total"><span>⭐ <b id="totalStars">0</b> / 60</span><button class="icon-btn" id="reset" title="Clear saved progress">Reset</button></div>
</header>
<main id="screen"></main>
<footer>Island Hustle is a game. Places and history are real; people, bands, businesses and prices are invented.</footer>
<script src="js/core.js"></script>
<script src="js/minibus.js"></script>
<script src="js/explorer.js"></script>
<script src="js/fishing.js"></script>
<script src="js/mascamp.js"></script>
<script src="js/main.js"></script>
</body>
</html>
